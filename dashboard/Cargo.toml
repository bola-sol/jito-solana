[package]
name = "agave-dashboard"
documentation = "https://docs.rs/agave-dashboard"
version = { workspace = true }
authors = { workspace = true }
description = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[features]
agave-unstable-api = []

[dependencies]
bincode = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
soketto = { workspace = true }
solana-account = { workspace = true }
solana-clock = { workspace = true }
solana-cluster-type = { workspace = true }
solana-config-interface = { workspace = true }
solana-gossip = { workspace = true }
solana-ledger = { workspace = true }
solana-pubkey = { workspace = true }
solana-runtime = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-version = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["compat"] }

[dev-dependencies]
# Depends on itself so that the whole crate is not gated out from under its own
# tests. `lib.rs` is behind `agave-unstable-api`, and without this a bare
# `cargo test -p agave-dashboard` would compile an empty crate and report zero
# tests passing rather than failing. The same pattern appears in gossip,
# ledger and runtime for the same reason.
agave-dashboard = { path = ".", features = ["agave-unstable-api"] }

# Re-declared with their test features so `src/fixture.rs` can build a bank, a
# blockstore and a cluster info. Cargo unifies these with the entries above for
# the test build; the shipped crate is unaffected.
solana-gossip = { workspace = true, features = ["dev-context-only-utils"] }
solana-keypair = { workspace = true }
solana-leader-schedule = { workspace = true }
solana-ledger = { workspace = true, features = ["dev-context-only-utils"] }
solana-net-utils = { workspace = true }
solana-runtime = { workspace = true, features = ["dev-context-only-utils"] }
solana-signer = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
